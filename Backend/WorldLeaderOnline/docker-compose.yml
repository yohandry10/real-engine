services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: worldleader
      POSTGRES_PASSWORD: worldleader
      POSTGRES_DB: worldleader
    ports:
      - "5432:5432"
    volumes:
      - worldleader-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      WL_ONLINE_BIND: 0.0.0.0:8787
      DATABASE_URL: postgres://worldleader:worldleader@postgres:5432/worldleader
      REDIS_URL: redis://redis:6379
    ports:
      - "8787:8787"

volumes:
  worldleader-postgres:
